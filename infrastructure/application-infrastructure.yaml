AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Kuok Group Training Lab - Three-tier Todo application.
  Tier 1 (Frontend): Amazon S3 static website.
  Tier 2 (Backend):  Amazon API Gateway HTTP API + two AWS Lambda functions.
  Tier 3 (Database): Amazon DynamoDB table.

# ---------------------------------------------------------------------------
# Parameters - kept to the few that genuinely help the lab (requirement 9).
# ---------------------------------------------------------------------------
Parameters:

  ProjectName:
    Type: String
    Default: kuok-todo
    Description: Prefix used to name every resource, so they are easy to find.
    AllowedPattern: '[a-z0-9][a-z0-9-]{1,20}'
    ConstraintDescription: Lowercase letters, numbers and hyphens only (2-21 characters).

  EnvironmentName:
    Type: String
    Default: dev
    Description: The environment this stack represents. This lab only uses dev.
    AllowedValues:
      - dev

  AllowedOrigin:
    Type: String
    Default: '*'
    Description: >
      Browser origin allowed to call the API (CORS). The lab uses * for simplicity.
      After your first deployment you can narrow this to the FrontendURL output.

  LogRetentionDays:
    Type: Number
    Default: 7
    Description: How long to keep Lambda logs. Short retention keeps the lab tidy and free.
    AllowedValues: [1, 3, 5, 7, 14, 30]

Resources:

  # =========================================================================
  # TIER 3 - DATABASE
  # =========================================================================

  # A deliberately simple key design: one partition key, no sort key, no indexes.
  TodoTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-records'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: todoId
          AttributeType: S
      KeySchema:
        - AttributeName: todoId
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  # =========================================================================
  # TIER 2 - BACKEND (Lambda)
  # =========================================================================

  # Log groups are created here (rather than letting Lambda create them) so that
  # retention is set from day one and everything is removed at teardown.
  AddRecordLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${EnvironmentName}-add-record'
      RetentionInDays: !Ref LogRetentionDays

  GetRecordsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${EnvironmentName}-get-records'
      RetentionInDays: !Ref LogRetentionDays

  # Each function gets its own role with exactly one DynamoDB action.
  AddRecordFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-add-record-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteRecords
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt TodoTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AddRecordLogGroup.Arn

  GetRecordsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-get-records-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadRecords
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt TodoTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt GetRecordsLogGroup.Arn

  # Lambda 1: add / create a record.
  # The code lives inline so that CloudFormation alone deploys the backend -
  # no build step, no zip files, no artifact bucket. Limit: 4096 characters.
  AddRecordFunction:
    Type: AWS::Lambda::Function
    DependsOn: AddRecordLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-add-record'
      Description: Saves one todo record into DynamoDB.
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt AddRecordFunctionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref TodoTable
      Code:
        ZipFile: |
          import json
          import os
          import uuid
          from datetime import datetime, timezone

          import boto3

          TABLE = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])


          def lambda_handler(event, context):
              """Create one todo record. Expects JSON body: {"title": "..."}."""
              try:
                  body = json.loads(event.get("body") or "{}")
              except json.JSONDecodeError:
                  return respond(400, {"message": "Request body must be valid JSON."})

              title = str(body.get("title") or "").strip()
              if not title:
                  return respond(400, {"message": "The field 'title' is required."})

              record = {
                  "todoId": str(uuid.uuid4()),
                  "title": title[:200],
                  "createdAt": datetime.now(timezone.utc).isoformat(),
              }

              TABLE.put_item(Item=record)
              print(f"Saved record {record['todoId']}")
              return respond(201, record)


          def respond(status_code, payload):
              return {
                  "statusCode": status_code,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps(payload),
              }

  # Lambda 2: get / list records.
  GetRecordsFunction:
    Type: AWS::Lambda::Function
    DependsOn: GetRecordsLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-get-records'
      Description: Returns all todo records from DynamoDB, newest first.
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt GetRecordsFunctionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref TodoTable
      Code:
        ZipFile: |
          import json
          import os

          import boto3

          TABLE = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])


          def lambda_handler(event, context):
              """Return every todo record. Scan is fine for a lab-sized table."""
              result = TABLE.scan(Limit=50)
              records = sorted(
                  result.get("Items", []),
                  key=lambda item: item.get("createdAt", ""),
                  reverse=True,
              )

              print(f"Returning {len(records)} record(s)")
              return {
                  "statusCode": 200,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps({"records": records}),
              }

  # =========================================================================
  # TIER 2 - BACKEND (API Gateway HTTP API)
  # =========================================================================

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-api'
      Description: Small HTTP API used by the static frontend.
      ProtocolType: HTTP
      # CORS is required: the browser loads the page from the S3 website origin
      # and then calls this API on a different origin.
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
        MaxAge: 300

  AddRecordIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AddRecordFunction.Arn
      PayloadFormatVersion: '2.0'

  GetRecordsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GetRecordsFunction.Arn
      PayloadFormatVersion: '2.0'

  AddRecordRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /records'
      Target: !Sub 'integrations/${AddRecordIntegration}'

  GetRecordsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /records'
      Target: !Sub 'integrations/${GetRecordsIntegration}'

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  # API Gateway needs explicit permission to invoke each function.
  AddRecordInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AddRecordFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  GetRecordsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetRecordsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  # =========================================================================
  # TIER 1 - FRONTEND (S3 static website)
  # =========================================================================

  # NOTE: S3 static website hosting requires the objects to be publicly readable.
  # That is acceptable for this training lab and is why the block-public-access
  # settings below are switched off. See docs/appendix-c-production-hardening.md
  # for the CloudFront + Origin Access Control pattern used in real systems.
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub '${ProjectName}-${EnvironmentName}-site-${AWS::AccountId}'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadForWebsiteHosting
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

# ---------------------------------------------------------------------------
# Outputs - the values the lab, the pipeline and the students all need.
# ---------------------------------------------------------------------------
Outputs:

  FrontendURL:
    Description: Open this in a browser to use the application.
    Value: !GetAtt FrontendBucket.WebsiteURL
    Export:
      Name: !Sub '${AWS::StackName}-FrontendURL'

  FrontendBucketName:
    Description: Bucket the pipeline publishes the frontend files into.
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${AWS::StackName}-FrontendBucketName'

  ApiEndpoint:
    Description: Base URL of the backend API, injected into app.js at publish time.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  TableName:
    Description: DynamoDB table holding the records.
    Value: !Ref TodoTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'
